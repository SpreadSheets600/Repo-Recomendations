<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag Cloud - Repo Recommendations for SpreadSheets600</title>
    <meta name="description" content="Repository topic tags for SpreadSheets600." />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="bg-base-300 text-base-content">
    <!-- Top Navigation -->
    <nav class="bg-base-100 border-b border-base-300 sticky top-0 z-50">
      <div class="navbar">
        <div class="flex-1">
          <a href="index.html" class="btn btn-ghost normal-case text-xl">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            Repo Discovery
          </a>
        </div>
        <!-- Desktop Navigation -->
        <div class="hidden md:flex gap-2">
          <a href="overview.html" class="btn btn-ghost btn-sm">Overview</a>
          <a href="tagcloud.html" class="btn btn-ghost btn-sm btn-active">Tag Cloud</a>
          <a href="index.html" class="btn btn-ghost btn-sm">Recommendations</a>
        </div>
        <div class="flex items-center gap-2">
          <div class="badge badge-primary">SpreadSheets600</div>
        </div>
      </div>
      <!-- Mobile Navigation Row -->
      <div class="md:hidden flex gap-2 px-4 p-2 border-t border-base-300">
        <a href="overview.html" class="btn btn-ghost btn-sm flex-1">Overview</a>
        <a href="tagcloud.html" class="btn btn-ghost btn-sm btn-active flex-1">Tag Cloud</a>
        <a href="index.html" class="btn btn-ghost btn-sm flex-1">Recommendations</a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold tracking-tight mb-2">Topic Tags</h1>
        <p class="text-base-content/60">All topics from source repositories and recommendations</p>
      </div>

      <!-- Controls -->
      <div class="bg-base-200 rounded-xl border border-base-content/10 p-6 mb-8">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
          <div class="flex-1 w-full md:max-w-md">
            <label class="text-sm font-medium text-base-content/70 mb-2 block">Search Tags</label>
            <input
              type="text"
              id="tag-filter"
              placeholder="Filter by name..."
              class="input input-bordered w-full bg-base-300"
            />
          </div>
          <div class="flex gap-3">
            <div class="form-control">
              <label class="label cursor-pointer gap-2">
                <span class="label-text text-sm">Source Repos</span>
                <input type="checkbox" id="show-source" class="checkbox checkbox-sm" checked />
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer gap-2">
                <span class="label-text text-sm">Recommendations</span>
                <input type="checkbox" id="show-recs" class="checkbox checkbox-sm" checked />
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="stat bg-base-200 rounded-xl border border-base-content/10 p-5">
          <div class="stat-title text-xs text-base-content/50">Total Unique Topics</div>
          <div class="stat-value text-2xl" id="total-tags">0</div>
        </div>
        <div class="stat bg-base-200 rounded-xl border border-base-content/10 p-5">
          <div class="stat-title text-xs text-base-content/50">Most Popular</div>
          <div class="stat-value text-lg line-clamp-1" id="top-tag">-</div>
          <div class="stat-desc" id="top-tag-count"></div>
        </div>
        <div class="stat bg-base-200 rounded-xl border border-base-content/10 p-5">
          <div class="stat-title text-xs text-base-content/50">Visible Tags</div>
          <div class="stat-value text-2xl" id="visible-tags">0</div>
        </div>
      </div>

      <!-- All Tags -->
      <div class="bg-base-200 rounded-xl border border-base-content/10 p-6 mb-8">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold">All Tags</h2>
          <button id="toggle-list" class="btn btn-sm btn-ghost gap-2">
            <span id="toggle-text">Hide List</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4" id="toggle-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
        </div>
        
        <div id="tags-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          <div class="text-center text-base-content/40 py-8 col-span-full">Loading tags...</div>
        </div>
      </div>

      <!-- Repositories for Selected Tag -->
      <div id="repos-section" class="bg-base-200 rounded-xl border border-base-content/10 p-6 hidden">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold">
            Repositories tagged with <span class="text-primary" id="selected-tag-name"></span>
          </h2>
          <button id="close-repos" class="btn btn-sm btn-ghost btn-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        
        <div id="repos-list" class="space-y-3">
          <!-- Repositories will be rendered here -->
        </div>
      </div>
    </main>

    <script>
      const dataUrl = "recommendations/latest.json";
      let allTags = new Map();
      let allRepos = new Map(); // Use Map to avoid duplicates

      async function loadData() {
        try {
          const response = await fetch(dataUrl, { cache: "no-store" });
          if (!response.ok) throw new Error("Failed to load data");
          const data = await response.json();
          processData(data.results || []);
          renderTags();
        } catch (error) {
          document.getElementById("tags-grid").innerHTML = 
            '<div class="text-center text-error py-8 col-span-full">Failed to load tag data</div>';
          console.error(error);
        }
      }

      function processData(results) {
        results.forEach((group) => {
          const sourceTopics = (group.metadata?.topics || []);
          const repoName = group.repo || 'Unknown';
          
          // Store source repo (use Map to avoid duplicates)
          if (!allRepos.has(repoName)) {
            allRepos.set(repoName, {
              name: repoName,
              description: group.metadata?.description || '',
              url: `https://github.com/${repoName}`,
              stars: group.total_stars || 0,
              language: Object.keys(group.metadata?.languages || {})[0] || '',
              topics: sourceTopics,
              isSource: true
            });
          }

          sourceTopics.forEach(topic => {
            const key = topic.toLowerCase();
            if (!allTags.has(key)) {
              allTags.set(key, { display: topic, sourceCount: 0, recCount: 0 });
            }
            const entry = allTags.get(key);
            entry.sourceCount++;
          });

          (group.recommendations || []).forEach(rec => {
            const recTopics = (rec.metadata?.topics || []);
            const recName = rec.repo || 'Unknown';
            
            // Store recommended repo (use Map to avoid duplicates)
            if (!allRepos.has(recName)) {
              allRepos.set(recName, {
                name: recName,
                description: rec.metadata?.description || '',
                url: `https://github.com/${recName}`,
                stars: rec.total_stars || 0,
                language: Object.keys(rec.metadata?.languages || {})[0] || '',
                topics: recTopics,
                isSource: false
              });
            }

            recTopics.forEach(topic => {
              const key = topic.toLowerCase();
              if (!allTags.has(key)) {
                allTags.set(key, { display: topic, sourceCount: 0, recCount: 0 });
              }
              const entry = allTags.get(key);
              entry.recCount++;
            });
          });
        });
      }

      function getFilteredTags(filter = "", showSource = true, showRecs = true) {
        return Array.from(allTags.entries())
          .filter(([key, data]) => {
            const matchesFilter = !filter || key.includes(filter.toLowerCase());
            const matchesType = (showSource && data.sourceCount > 0) || 
                               (showRecs && data.recCount > 0);
            return matchesFilter && matchesType;
          })
          .map(([key, data]) => ({
            ...data,
            total: data.sourceCount + data.recCount
          }))
          .sort((a, b) => b.total - a.total);
      }

      function renderTags() {
        const filter = document.getElementById("tag-filter").value;
        const showSource = document.getElementById("show-source").checked;
        const showRecs = document.getElementById("show-recs").checked;
        
        const tags = getFilteredTags(filter, showSource, showRecs);

        // Update stats
        document.getElementById("total-tags").textContent = allTags.size;
        document.getElementById("visible-tags").textContent = tags.length;
        
        if (tags.length > 0) {
          document.getElementById("top-tag").textContent = tags[0].display;
          document.getElementById("top-tag-count").textContent = `${tags[0].total} repositories`;
        } else {
          document.getElementById("top-tag").textContent = "-";
          document.getElementById("top-tag-count").textContent = "";
        }

        const grid = document.getElementById("tags-grid");
        
        if (tags.length === 0) {
          grid.innerHTML = '<div class="text-center text-base-content/40 py-8 col-span-full">No tags found</div>';
          return;
        }

        const html = tags.map((tag) => {
          return `
            <button class="flex items-center justify-between p-3 bg-base-300/50 rounded-lg hover:bg-base-300 transition-colors w-full text-left cursor-pointer hover:shadow-md" 
                    onclick="showReposForTag('${escapeHtml(tag.display)}')">
              <span class="font-medium text-base-content">${escapeHtml(tag.display)}</span>
              <span class="badge badge-primary badge-sm">${tag.total}</span>
            </button>
          `;
        }).join('');

        grid.innerHTML = html;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function showReposForTag(tagName) {
        const tagKey = tagName.toLowerCase();
        const repos = Array.from(allRepos.values()).filter(repo => 
          repo.topics.some(topic => topic.toLowerCase() === tagKey)
        );

        // Sort by stars
        repos.sort((a, b) => b.stars - a.stars);

        // Update UI
        document.getElementById('selected-tag-name').textContent = tagName;
        const reposList = document.getElementById('repos-list');
        
        if (repos.length === 0) {
          reposList.innerHTML = '<div class="text-center text-base-content/40 py-8">No repositories found</div>';
        } else {
          const html = repos.map(repo => `
            <div class="bg-base-300/50 rounded-lg p-4 hover:bg-base-300 transition-colors">
              <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                  <a href="${escapeHtml(repo.url)}" target="_blank" class="font-semibold text-base-content hover:text-primary transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    ${escapeHtml(repo.name)}
                  </a>
                  ${repo.description ? `<p class="text-sm text-base-content/60 mt-1">${escapeHtml(repo.description)}</p>` : ''}
                  <div class="flex items-center gap-3 mt-2 text-xs text-base-content/50">
                    ${repo.language ? `
                      <div class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${getLanguageColor(repo.language)}"></span>
                        <span>${escapeHtml(repo.language)}</span>
                      </div>
                    ` : ''}
                    <div class="flex items-center gap-1">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
                      </svg>
                      ${repo.stars.toLocaleString()}
                    </div>
                    ${repo.isSource ? '<span class="badge badge-xs badge-accent">Source</span>' : '<span class="badge badge-xs badge-secondary">Recommended</span>'}
                  </div>
                </div>
              </div>
            </div>
          `).join('');
          reposList.innerHTML = html;
        }

        // Show the repos section and scroll to it
        const reposSection = document.getElementById('repos-section');
        reposSection.classList.remove('hidden');
        reposSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function getLanguageColor(language) {
        const colors = {
          'JavaScript': '#f1e05a',
          'Python': '#3572A5',
          'Java': '#b07219',
          'TypeScript': '#2b7489',
          'C++': '#f34b7d',
          'C': '#555555',
          'C#': '#178600',
          'PHP': '#4F5D95',
          'Ruby': '#701516',
          'Go': '#00ADD8',
          'Swift': '#ffac45',
          'Kotlin': '#F18E33',
          'Rust': '#dea584',
          'Scala': '#c22d40',
          'Shell': '#89e051',
          'HTML': '#e34c26',
          'CSS': '#563d7c',
          'Vue': '#41b883',
          'Dart': '#00B4AB',
          'R': '#198CE7',
          'Jupyter Notebook': '#DA5B0B'
        };
        return colors[language] || '#8b949e';
      }

      // Event listeners
      document.getElementById("tag-filter").addEventListener("input", renderTags);
      document.getElementById("show-source").addEventListener("change", renderTags);
      document.getElementById("show-recs").addEventListener("change", renderTags);

      // Close repos section
      document.getElementById("close-repos").addEventListener("click", () => {
        document.getElementById("repos-section").classList.add("hidden");
      });

      // Toggle list visibility
      document.getElementById("toggle-list").addEventListener("click", () => {
        const grid = document.getElementById("tags-grid");
        const toggleText = document.getElementById("toggle-text");
        const toggleIcon = document.getElementById("toggle-icon");
        
        if (grid.classList.contains("hidden")) {
          grid.classList.remove("hidden");
          toggleText.textContent = "Hide List";
          toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />';
        } else {
          grid.classList.add("hidden");
          toggleText.textContent = "Show List";
          toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />';
        }
      });

      // Load data on page load
      loadData();
    </script>
  </body>
</html>
