<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recommendations - Repo Recommendations for {{ username }}</title>
    <meta name="description" content="Repository recommendations for {{ username }}." />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="stylesheet" href="styles.css" />

    <!-- SVG Icons (hidden sprite) -->
    <svg style="display:none">
      <symbol id="icon-star" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </symbol>
      <symbol id="icon-fork" viewBox="0 0 16 16">
        <path fill="currentColor" fill-rule="evenodd" d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"/>
      </symbol>
      <symbol id="icon-github" viewBox="0 0 16 16">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </symbol>
    </svg>

    <style>
      :root {
        --lang-0: #3b82f6;
        --lang-1: #10b981;
        --lang-2: #f59e0b;
        --lang-3: #ef4444;
        --lang-4: #8b5cf6;
        --lang-5: #ec4899;
        --lang-6: #06b6d4;
        --lang-7: #84cc16;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: oklch(0.3 0 0); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: oklch(0.4 0 0); }
    </style>
  </head>

  <body class="bg-base-300 text-base-content overflow-hidden h-screen">
    
    <!-- Top Navigation -->
    <nav class="bg-base-100 border-b border-base-300 sticky top-0 z-50">
      <div class="navbar">
        <div class="flex-1">
          <button id="mobile-menu-btn" class="btn btn-ghost btn-square md:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <a href="index.html" class="btn btn-ghost normal-case text-xl">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            Repo Discovery
          </a>
        </div>
        <!-- Desktop Navigation -->
        <div class="hidden md:flex gap-2">
          <a href="overview.html" class="btn btn-ghost btn-sm">Overview</a>
          <a href="tagcloud.html" class="btn btn-ghost btn-sm">Tag Cloud</a>
          <a href="index.html" class="btn btn-ghost btn-sm btn-active">Recommendations</a>
        </div>
        <div class="flex items-center gap-2">
          <div class="badge badge-primary">{{ username }}</div>
        </div>
      </div>
      <!-- Mobile Navigation Row -->
      <div class="md:hidden flex gap-2 px-4 p-2 border-t border-base-300">
        <a href="overview.html" class="btn btn-ghost btn-sm flex-1">Overview</a>
        <a href="tagcloud.html" class="btn btn-ghost btn-sm flex-1">Tag Cloud</a>
        <a href="index.html" class="btn btn-ghost btn-sm btn-active flex-1">Recommendations</a>
      </div>
    </nav>

    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-200"></div>

    <!-- App layout -->
    <div class="flex h-[calc(100vh-4rem)] w-full overflow-hidden">

      <!-- SIDEBAR -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full bg-base-200 border-r border-base-content/10 flex flex-col transition-transform duration-200 ease-out md:static md:translate-x-0 md:z-auto"
      >

        <!-- Nav list -->
        <nav class="flex-1 overflow-y-auto overflow-x-hidden min-h-0 p-3">
          <ul id="sidebar-nav" class="flex flex-col gap-0.5">
            {% for group in results %}
            <li>
              <a
                class="sidebar-link group flex items-center justify-between rounded-lg px-3 py-2.5 text-[13px] font-medium cursor-pointer transition-all duration-150 {% if loop.first %}active bg-base-300 text-base-content shadow-sm shadow-base-300/50{% else %}text-base-content/50 hover:bg-base-300/60 hover:text-base-content{% endif %}"
                data-panel="{{ loop.index0 }}"
              >
                <span class="flex-1 min-w-0 truncate">{{ group.repo.split('/')[-1] }}</span>
                <span class="text-[11px] text-base-content/40 bg-base-content/5 px-2 py-0.5 rounded-full tabular-nums min-w-[28px] text-center">{{ group.recommendations | length }}</span>
              </a>
            </li>
            {% endfor %}
          </ul>
        </nav>

        <!-- Footer -->
        <div class="shrink-0 border-t border-base-content/10 px-6 py-4">
          <div class="flex items-center justify-between text-[11px] text-base-content/35 font-mono">
            <span class="truncate">{{ username }}</span>
            <span class="tabular-nums">{{ repo_count }} sources</span>
          </div>
        </div>
      </aside>

      <!-- MAIN AREA -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- Top bar -->
        <header class="h-16 min-h-16 shrink-0 border-b border-base-content/10 bg-base-200/80 backdrop-blur-md px-4 flex items-center gap-4 md:px-10">

          <div class="relative flex-1 max-w-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 size-3.5 text-base-content/40 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input
              id="search"
              type="text"
              class="input input-sm input-bordered w-full pl-9 bg-base-300/60 text-sm"
              placeholder="Search source + recommendations..."
              autocomplete="off"
            />
            <div id="search-results" class="absolute left-0 right-0 top-[calc(100%+0.5rem)] hidden rounded-lg border border-base-content/10 bg-base-200 shadow-xl shadow-black/25 z-30"></div>
          </div>

        </header>

        <!-- Scrollable content -->
        <div class="flex-1 overflow-y-auto" id="content">
          <section id="repo-section" class="max-w-[1200px] mx-auto px-4 py-8 md:px-10"></section>

        </div>
      </div>
    </div>

    <script id="analytics-payload" type="application/json">{{ analytics_json | safe }}</script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const analyticsNode = document.getElementById("analytics-payload");
      const analytics = analyticsNode ? JSON.parse(analyticsNode.textContent || "{}") : {};
      const dataUrl = "{{ data_url }}";
      let searchIndex = [];
      let results = [];

      const sidebar  = document.getElementById("sidebar");
      const overlay  = document.getElementById("sidebar-overlay");
      const menuBtn  = document.getElementById("mobile-menu-btn");
      const closeBtn = document.getElementById("sidebar-close");
      const md       = window.matchMedia("(min-width: 768px)");

      function openMobile()  { sidebar.classList.remove("-translate-x-full"); overlay.classList.remove("hidden"); }
      function closeMobile() { sidebar.classList.add("-translate-x-full"); overlay.classList.add("hidden"); }

      menuBtn?.addEventListener("click", openMobile);
      closeBtn?.addEventListener("click", closeMobile);
      overlay?.addEventListener("click", closeMobile);
      md.addEventListener("change", () => { if (md.matches) closeMobile(); });

      const links   = Array.from(document.querySelectorAll(".sidebar-link"));
      const content = document.getElementById("content");
      const repoSection = document.getElementById("repo-section");
      let activeIdx = 0;
      const groupHtmlCache = new Map();
      const languageColors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#06b6d4", "#84cc16"];

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function compactNumber(value) {
        const num = Number(value) || 0;
        if (Math.abs(num) < 1000) return `${Math.trunc(num)}`;
        const units = ["K", "M", "B", "T"];
        let val = num;
        let idx = -1;
        while (Math.abs(val) >= 1000 && idx < units.length - 1) {
          val /= 1000;
          idx += 1;
        }
        return `${val.toFixed(1).replace(/\.0$/, "")}${units[idx]}`;
      }

      function renderTopicPills(topics, maxCount, className) {
        if (!topics || !topics.length) return "";
        return topics.slice(0, maxCount).map((topic) => {
          const label = escapeHtml(String(topic).replace(/-/g, " "));
          return `<span class="${className}">${label}</span>`;
        }).join("");
      }

      function renderLanguages(languages, compact = false) {
        const entries = Object.entries(languages || {});
        if (!entries.length) return "";
        const bars = entries.map(([lang, pct], idx) => (
          `<div style="width: ${escapeHtml(pct)}; background-color: ${languageColors[idx % languageColors.length]};" title="${escapeHtml(lang)}: ${escapeHtml(pct)}"></div>`
        )).join("");
        const limit = compact ? 3 : 4;
        const labels = entries.slice(0, limit).map(([lang, pct], idx) => (
          `<span class="flex items-center gap-1.5 ${compact ? "text-[11px]" : "text-xs"} text-base-content/50">
            <span class="${compact ? "w-1.5 h-1.5" : "w-2 h-2"} rounded-full shrink-0" style="background-color: ${languageColors[idx % languageColors.length]};"></span>
            ${escapeHtml(lang)} ${escapeHtml(pct)}
          </span>`
        )).join("");
        const containerClass = compact ? "pt-3 mt-3" : "max-w-md";
        const labelGapClass = compact ? "flex flex-wrap gap-x-3 gap-y-1" : "flex flex-wrap gap-x-4 gap-y-1";
        return `
          <div class="${containerClass}">
            <div class="flex h-1.5 rounded-full overflow-hidden bg-base-300 mb-2 w-full">${bars}</div>
            <div class="${labelGapClass}">${labels}</div>
          </div>
        `;
      }

      function buildGroupHtml(group, groupIndex) {
        const meta = group.metadata || {};
        const topics = meta.topics || [];
        const languages = meta.languages || {};
        const recommendations = group.recommendations || [];
        const sourceStats = (group.total_stars || group.total_forks)
          ? `
            <div class="flex items-center gap-6 mb-5 text-sm text-base-content/60">
              ${group.total_stars ? `<span class="flex items-center gap-1.5" title="Stars"><svg class="size-4 opacity-70"><use href="#icon-star"/></svg>${compactNumber(group.total_stars)}</span>` : ""}
              ${group.total_forks ? `<span class="flex items-center gap-1.5" title="Forks"><svg class="size-4 opacity-70"><use href="#icon-fork"/></svg>${compactNumber(group.total_forks)}</span>` : ""}
            </div>
          `
          : "";
        const sourceTopics = topics.length
          ? `<div class="flex flex-wrap gap-1.5 mt-5">${renderTopicPills(topics, topics.length, "text-[10px] text-base-content/60 bg-base-content/[0.03] border border-base-content/10 px-2 py-0.5 rounded capitalize transition-colors hover:border-base-content/25 hover:bg-base-content/[0.06] hover:text-base-content/80")}</div>`
          : "";
        const cards = recommendations.map((rec, recIndex) => {
          const recMeta = rec.metadata || {};
          const recTopics = recMeta.topics || [];
          const stats = (rec.total_stars || rec.total_forks)
            ? `
              ${rec.total_stars ? `<span class="flex items-center gap-1" title="Stars"><svg class="size-3.5 opacity-70"><use href="#icon-star"/></svg>${compactNumber(rec.total_stars)}</span>` : ""}
              ${rec.total_forks ? `<span class="flex items-center gap-1" title="Forks"><svg class="size-3.5 opacity-70"><use href="#icon-fork"/></svg>${compactNumber(rec.total_forks)}</span>` : ""}
            `
            : `<span class="text-base-content/20">&mdash;</span>`;
          return `
            <a
              href="https://github.com/${encodeURI(rec.repo)}"
              target="_blank"
              rel="noreferrer"
              class="rec-card group flex flex-col rounded-xl bg-base-200 border border-base-content/10 p-5 transition-all duration-200 hover:border-base-content/20 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-black/20"
              id="rec-${groupIndex}-${recIndex}"
            >
              <div class="flex items-start justify-between gap-2 mb-2.5">
                <h3 class="text-[15px] font-semibold text-base-content break-all leading-snug">${escapeHtml(rec.repo)}</h3>
              </div>
              <p class="text-[13px] text-base-content/55 leading-relaxed flex-1 line-clamp-3 mb-4">${escapeHtml(recMeta.description || "No description available.")}</p>
              ${recTopics.length ? `<div class="flex flex-wrap gap-1.5 mb-4">${renderTopicPills(recTopics, 5, "text-[10px] text-base-content/55 bg-base-content/[0.03] border border-base-content/10 px-1.5 py-px rounded capitalize")}</div>` : ""}
              <div class="mt-auto flex flex-col">
                ${renderLanguages(recMeta.languages || {}, true)}
                <div class="flex items-center justify-between pt-3 mt-3 text-[11px] text-base-content/40 tabular-nums">
                  <div class="flex items-center gap-3">${stats}</div>
                  <span class="flex items-center gap-1 text-base-content/60 font-semibold bg-base-300 px-1.5 py-0.5 rounded font-mono text-[10px]" title="Common Forkers">${escapeHtml(rec.count || 0)}</span>
                </div>
              </div>
            </a>
          `;
        }).join("");

        const cardsArea = cards
          ? `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">${cards}</div>`
          : `<div class="rounded-xl bg-base-200 border border-base-content/10 p-12 text-center"><p class="text-sm text-base-content/40">No recommendations found for this repository.</p></div>`;

        return `
          <div class="section-container">
            <div id="source-${groupIndex}" class="pb-8 mb-8 border-b border-base-content/10 scroll-mt-20">
              <h1 class="text-2xl font-semibold tracking-tight mb-3">
                <a href="https://github.com/${encodeURI(group.repo)}" target="_blank" rel="noreferrer" class="hover:underline hover:decoration-base-content/30 underline-offset-4">${escapeHtml(group.repo)}</a>
              </h1>
              <p class="text-[15px] text-base-content/60 leading-relaxed mb-6 max-w-3xl">${escapeHtml(meta.description || "No description available.")}</p>
              ${sourceStats}
              ${renderLanguages(languages, false)}
              ${sourceTopics}
            </div>
            ${cardsArea}
          </div>
        `;
      }

      function renderGroup(idx, targetAnchor = "") {
        const group = results[idx];
        if (!group || !repoSection) return;

        if (!groupHtmlCache.has(idx)) {
          groupHtmlCache.set(idx, buildGroupHtml(group, idx));
        }
        repoSection.innerHTML = groupHtmlCache.get(idx);

        if (targetAnchor) {
          requestAnimationFrame(() => {
            const target = document.getElementById(targetAnchor);
            if (target) {
              target.scrollIntoView({ behavior: "auto", block: "start" });
            }
          });
        }
      }

      function setActive(idx, targetAnchor = "") {
        if (links[activeIdx]) {
          links[activeIdx].classList.remove("active", "bg-base-300", "text-base-content", "shadow-sm", "shadow-base-300/50");
          links[activeIdx].classList.add("text-base-content/50");
        }

        activeIdx = idx;

        if (links[activeIdx]) {
          links[activeIdx].classList.add("active", "bg-base-300", "text-base-content", "shadow-sm", "shadow-base-300/50");
          links[activeIdx].classList.remove("text-base-content/50");
          links[activeIdx].scrollIntoView({ block: "nearest", behavior: "auto" });
        }
        renderGroup(activeIdx, targetAnchor);
        content.scrollTop = 0;

        if (!md.matches) closeMobile();
      }

      if (links.length > 0) setActive(0);

      links.forEach((a, i) => a.addEventListener("click", (e) => {
        e.preventDefault();
        setActive(i);
      }));

      const searchInput = document.getElementById("search");
      const resultsPanel = document.getElementById("search-results");
      const makeOptions = {
        includeScore: true,
        threshold: 0.35,
        ignoreLocation: true,
        keys: [
          { name: "repo", weight: 0.45 },
          { name: "description", weight: 0.25 },
          { name: "topics", weight: 0.15 },
          { name: "parent_repo", weight: 0.15 }
        ]
      };
      let fuse = null;
      let activeSearchIndex = -1;
      let currentSearchResults = [];

      function buildSearchIndex(data) {
        const items = [];
        data.forEach((group, groupIndex) => {
          const groupMeta = group.metadata || {};
          items.push({
            type: "source",
            repo: group.repo || "",
            description: groupMeta.description || "",
            topics: groupMeta.topics || [],
            group_index: groupIndex,
            parent_repo: group.repo || "",
            anchor: `source-${groupIndex}`
          });
          (group.recommendations || []).forEach((rec, recIndex) => {
            const recMeta = rec.metadata || {};
            items.push({
              type: "recommendation",
              repo: rec.repo || "",
              description: recMeta.description || "",
              topics: recMeta.topics || [],
              group_index: groupIndex,
              parent_repo: group.repo || "",
              anchor: `rec-${groupIndex}-${recIndex}`
            });
          });
        });
        return items;
      }

      async function loadResultsData() {
        if (repoSection) {
          repoSection.innerHTML = '<div class="rounded-xl bg-base-200 border border-base-content/10 p-8 text-sm text-base-content/50">Loading repositories...</div>';
        }
        try {
          const response = await fetch(dataUrl, { cache: "no-store" });
          if (!response.ok) throw new Error(`Failed to load data (${response.status})`);
          const data = await response.json();
          results = data.results || [];
          searchIndex = buildSearchIndex(results);
          fuse = window.Fuse ? new Fuse(searchIndex, makeOptions) : null;
          renderGroup(activeIdx);
        } catch (error) {
          if (repoSection) {
            repoSection.innerHTML = '<div class="rounded-xl bg-base-200 border border-base-content/10 p-8 text-sm text-error">Failed to load recommendations data.</div>';
          }
        }
      }

      function hideSearchResults() {
        activeSearchIndex = -1;
        currentSearchResults = [];
        if (resultsPanel) {
          resultsPanel.innerHTML = "";
          resultsPanel.classList.add("hidden");
        }
      }

      function goToSearchItem(item) {
        if (!item) return;
        const index = Number(item.group_index || 0);
        const anchor = item.anchor || "";
        setActive(index, anchor);
        hideSearchResults();
      }

      function updateSearchHighlight() {
        if (!resultsPanel) return;
        Array.from(resultsPanel.querySelectorAll("[data-search-row]")).forEach((row, idx) => {
          const isActive = idx === activeSearchIndex;
          row.classList.toggle("bg-base-300", isActive);
          row.classList.toggle("text-base-content", isActive);
        });
      }

      function renderSearchResults(term) {
        if (!resultsPanel || !term || !fuse) {
          hideSearchResults();
          return;
        }

        const hits = fuse.search(term, { limit: 10 });
        currentSearchResults = hits.map((result) => result.item);
        activeSearchIndex = currentSearchResults.length ? 0 : -1;

        if (!currentSearchResults.length) {
          resultsPanel.innerHTML = '<p class="px-3 py-2 text-xs text-base-content/50">No matches found.</p>';
          resultsPanel.classList.remove("hidden");
          return;
        }

        resultsPanel.innerHTML = currentSearchResults.map((item, idx) => {
          const kind = item.type === "source" ? "Source" : "Recommendation";
          return `
            <button
              type="button"
              data-search-row="${idx}"
              class="w-full text-left px-3 py-2 border-b border-base-content/10 last:border-b-0 hover:bg-base-300/70 transition-colors"
            >
              <div class="flex items-center justify-between gap-2">
                <span class="text-sm truncate">${escapeHtml(item.repo)}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-base-content/10 text-base-content/60">${kind}</span>
              </div>
              <p class="text-[11px] text-base-content/50 truncate">${escapeHtml(item.parent_repo)}</p>
            </button>
          `;
        }).join("");

        resultsPanel.classList.remove("hidden");
        updateSearchHighlight();
      }

      let searchDebounceTimer = null;
      searchInput?.addEventListener("input", () => {
        window.clearTimeout(searchDebounceTimer);
        searchDebounceTimer = window.setTimeout(() => {
          renderSearchResults(searchInput.value.trim());
        }, 80);
      });

      searchInput?.addEventListener("keydown", (event) => {
        if (!currentSearchResults.length) return;

        if (event.key === "ArrowDown") {
          event.preventDefault();
          activeSearchIndex = Math.min(activeSearchIndex + 1, currentSearchResults.length - 1);
          updateSearchHighlight();
        }

        if (event.key === "ArrowUp") {
          event.preventDefault();
          activeSearchIndex = Math.max(activeSearchIndex - 1, 0);
          updateSearchHighlight();
        }

        if (event.key === "Enter") {
          event.preventDefault();
          const item = activeSearchIndex >= 0 ? currentSearchResults[activeSearchIndex] : currentSearchResults[0];
          goToSearchItem(item);
        }

        if (event.key === "Escape") {
          hideSearchResults();
        }
      });

      document.addEventListener("click", (event) => {
        if (!resultsPanel || !searchInput) return;
        if (event.target !== searchInput && !resultsPanel.contains(event.target)) {
          hideSearchResults();
        }
      });

      resultsPanel?.addEventListener("click", (event) => {
        const row = event.target.closest("[data-search-row]");
        if (!row) return;
        const idx = Number(row.dataset.searchRow);
        goToSearchItem(currentSearchResults[idx]);
      });

      loadResultsData();
    });
    </script>
  </body>
</html>
